# ==============================================================================
#  ArkaSMPStyle  -  paid cosmetic ranks, chat tags and colours, rank commands
#  Ranks are LuckPerms groups. A rank never gives items, money, flying or fighting help.
#  Text uses MiniMessage:  <green>text</green>  <gradient:#ff8a00:#e52e71>text</gradient>  <bold>
#  After editing run:  /style reload
# ==============================================================================

# MANAGED BY THE PLUGIN - DO NOT CHANGE THIS LINE. It stores the plugin version that last updated this file.
# When you install a newer version, new options are added below automatically and your settings are kept
# (a backup of the old file goes to the config-backups folder).
config-version: "auto"

# ------------------------------------------------------------------------------
#  RANKS, lowest first. A player's rank is the highest one whose LuckPerms group they are in. Monthly ranks are
#  temporary groups, so LuckPerms removes them when the time is up:
#     /lp user <name> parent addtemp pro 30d accumulate
#  A higher rank includes everything of the lower ones (commands, tags, colours).
#  Homes, player warps and the warp fee are set in LuckPerms with ArkaSMPCore's permission nodes, see README.
# ------------------------------------------------------------------------------
ranks:
  pro:
    group: pro                          # LuckPerms group name
    name: "<aqua>Pro</aqua>"
    badge: "<aqua>[Pro]</aqua> "        # shown in chat in front of the name
    name-format: "<aqua>{name}</aqua>"  # how the player's name looks in chat
    icon: GOLD_INGOT                    # item shown for this rank in the /style menu
    monthly-claim-blocks: 2000          # bonus claim blocks, once per calendar month (0 = none)
    commands: [craft, trash, anvil]
  ultra:
    group: ultra
    name: "<gradient:#ff8a00:#e52e71>Ultra</gradient>"
    badge: "<gradient:#ff8a00:#e52e71>[Ultra]</gradient> "
    name-format: "<gradient:#ff8a00:#e52e71>{name}</gradient>"
    icon: NETHER_STAR
    monthly-claim-blocks: 5000
    commands: [enchant, grindstone, stonecutter, loom, smithing, cartography, ec]

# ------------------------------------------------------------------------------
#  ROLES: the LuckPerms groups of the whole server and what each may and may not do.
#  Nothing here changes LuckPerms by itself. You run, as the console:
#     /style setup          shows exactly what would change, and changes nothing
#     /style setup apply    does it (saves a copy of the groups first, to plugins/ArkaSMPStyle/setup-backups)
#  It creates missing groups and only touches what is listed here. It never deletes a group, and running it again
#  changes nothing that is already right. If this section has a mistake it refuses to run and says where.
#
#  Per group (the name is the LuckPerms group name):
#    weight:   higher weight wins when a player has several groups (tab list prefix, conflicting permissions)
#    parents:  groups it inherits everything from
#    allow:    permissions it gets (set to true)
#    deny:     permissions set to false, so they stay blocked even if some other group gives them
#    remove:   permissions taken off the group completely (use it to clean up an old, too wide grant)
#  "@console-only" in a deny list stands for the dangerous commands: /op /stop /execute /fill /give, LuckPerms
#  editing and so on. They are never allowed on any group. Wildcards (*) cannot be allowed at all. Only global,
#  permanent nodes are managed: temporary ones and ones with a context (world=...) are left alone.
#  Homes 8 = the base 3 plus 5, and player warps 6 = the base 1 plus 5: change the numbers if your base is different.
# ------------------------------------------------------------------------------
roles:
  default:
    deny: ["@console-only", bukkit.command.plugins, bukkit.command.version, bukkit.command.help,
           minecraft.command.me, minecraft.command.teammsg]
  pro:
    weight: 30
    allow: [arka.homes.limit.8, arka.pwarps.limit.6, arka.warp.free]
  media:
    weight: 35
    parents: [pro]
  ultra:
    weight: 40
    parents: [pro]
    # The UltraCosmetics lines are for Ultra only (Pro and free players get none). Only hats, emotes and suits are given
    # as groups. Add gadgets, pets and effects one permission at a time: wildcards are not allowed for them.
    allow: [arka.homes.limit.1000, arka.pwarps.limit.13, arka.warp.free,
            ultracosmetics.openmenu, ultracosmetics.hats.*, ultracosmetics.emotes.*, ultracosmetics.suits.*]
  youtuber:
    weight: 45
    parents: [ultra]
  helper:
    weight: 50
    allow: [arka.afk.bypass, arka.leaderboard.hide, arkaeco.baltop.hide, arka.stats, arka.lag,
            minecraft.command.kick]
  builder:
    weight: 55
    allow: [arka.afk.bypass]
  mod:
    weight: 60
    parents: [helper]
    allow: [minecraft.command.teleport, arkaeco.admin.balance]
  developer:
    weight: 65
    allow: [arka.afk.bypass, arka.leaderboard.hide, arkaeco.baltop.hide, arka.stats, arka.lag,
            minecraft.command.teleport, bukkit.command.plugins, bukkit.command.version]
  srmod:
    weight: 70
    parents: [mod, ultra]
    allow: [minecraft.command.ban, minecraft.command.pardon, minecraft.command.banlist, arka.claims.bypass,
            arkaeco.admin.log, arkaeco.admin.freeze]
  admin:
    weight: 100
    parents: [srmod]
    allow: [arka.admin, arka.warp.admin, arkaeco.admin.give, arkaeco.admin.take, arkaeco.admin.set,
            arkaeco.admin.reset, arkaeco.admin.reload, arkaeco.shop.admin, arkastyle.admin, mcbackup.admin,
            luckperms.user.info, luckperms.user.parent.info, luckperms.user.parent.add, luckperms.user.parent.remove,
            luckperms.user.parent.addtemp, luckperms.user.parent.removetemp, luckperms.group.info,
            bukkit.command.plugins, bukkit.command.version,
            minecraft.command.ban-ip, minecraft.command.pardon-ip, minecraft.command.gamemode, minecraft.command.time,
            minecraft.command.weather, minecraft.command.whitelist]
    deny: ["@console-only"]
    remove: [minecraft.command.*, luckperms.*, arkaeco.admin.*, "*"]

rank-commands:
  block-in-combat: true                 # /anvil, /ec ... are refused while the player is in PvP combat

# ------------------------------------------------------------------------------
#  CHAT
# ------------------------------------------------------------------------------
chat:
  enabled: true                         # set false if another plugin formats your chat
  # {badge} rank badge, {tag} the unique tag the player picked, {name} the player name, {message} what they typed
  format: "{badge}{tag}{name}<dark_gray> » </dark_gray>{message}"
  default-message-color: "<white>"      # message colour of players who did not pick one

# Message colours players can pick in /style. "rank" is the lowest rank that may use it: free, pro or ultra.
# "format" is a MiniMessage opening tag. "material" is the menu icon.
chat-colors:
  white:   {name: "White",   format: "<white>",   material: WHITE_DYE,      rank: free}
  gold:    {name: "Gold",    format: "<gold>",    material: ORANGE_DYE,     rank: pro}
  aqua:    {name: "Aqua",    format: "<aqua>",    material: LIGHT_BLUE_DYE, rank: pro}
  green:   {name: "Green",   format: "<green>",   material: LIME_DYE,       rank: pro}
  pink:    {name: "Pink",    format: "<light_purple>", material: PINK_DYE,  rank: pro}
  red:     {name: "Red",     format: "<red>",     material: RED_DYE,        rank: ultra}
  yellow:  {name: "Yellow",  format: "<yellow>",  material: YELLOW_DYE,     rank: ultra}
  blue:    {name: "Blue",    format: "<blue>",    material: BLUE_DYE,       rank: ultra}
  purple:  {name: "Purple",  format: "<dark_purple>", material: PURPLE_DYE, rank: ultra}
  gray:    {name: "Gray",    format: "<gray>",    material: GRAY_DYE,       rank: ultra}
  fire:    {name: "Fire",    format: "<gradient:#ff512f:#f09819>",       material: BLAZE_POWDER,    rank: ultra}
  ocean:   {name: "Ocean",   format: "<gradient:#2193b0:#6dd5ed>",       material: PRISMARINE_SHARD, rank: ultra}
  sunset:  {name: "Sunset",  format: "<gradient:#ff8a00:#e52e71>",       material: GOLDEN_CARROT,   rank: ultra}
  mint:    {name: "Mint",    format: "<gradient:#11998e:#38ef7d>",       material: SLIME_BALL,      rank: ultra}
  galaxy:  {name: "Galaxy",  format: "<gradient:#7f00ff:#e100ff>",       material: AMETHYST_SHARD,  rank: ultra}
  rainbow: {name: "Rainbow", format: "<rainbow>",                        material: NETHER_STAR,     rank: ultra}

# Unique tags shown before the name. Same "rank" rule as above. Players pick one in /style.
tags:
  star:      {name: "Star",      format: "<yellow>[✦]</yellow> ",            material: GLOWSTONE_DUST, rank: pro}
  knight:    {name: "Knight",    format: "<gray>[Knight]</gray> ",           material: IRON_SWORD,     rank: pro}
  miner:     {name: "Miner",     format: "<aqua>[Miner]</aqua> ",            material: DIAMOND_PICKAXE, rank: pro}
  lucky:     {name: "Lucky",     format: "<green>[☘ Lucky]</green> ",        material: EMERALD,        rank: pro}
  builder:   {name: "Builder",   format: "<gold>[Builder]</gold> ",          material: BRICKS,         rank: pro}
  explorer:  {name: "Explorer",  format: "<dark_aqua>[Explorer]</dark_aqua> ", material: COMPASS,      rank: pro}
  raja:      {name: "Raja",      format: "<gradient:#f7971e:#ffd200>[♛ Raja]</gradient> ",   material: GOLDEN_HELMET,  rank: ultra}
  rani:      {name: "Rani",      format: "<gradient:#ee0979:#ff6a00>[♛ Rani]</gradient> ",   material: GOLDEN_APPLE,   rank: ultra}
  yodha:     {name: "Yodha",     format: "<gradient:#cb2d3e:#ef473a>[Yodha]</gradient> ",     material: NETHERITE_SWORD, rank: ultra}
  sage:      {name: "Sage",      format: "<gradient:#7f00ff:#e100ff>[Sage]</gradient> ",      material: ENCHANTED_BOOK, rank: ultra}
  shadow:    {name: "Shadow",    format: "<gradient:#232526:#757f9a>[Shadow]</gradient> ",    material: ENDER_PEARL,    rank: ultra}
  frost:     {name: "Frost",     format: "<gradient:#2193b0:#6dd5ed>[❄ Frost]</gradient> ",   material: BLUE_ICE,       rank: ultra}
  blaze:     {name: "Blaze",     format: "<gradient:#ff512f:#f09819>[Blaze]</gradient> ",     material: BLAZE_ROD,      rank: ultra}
  phoenix:   {name: "Phoenix",   format: "<gradient:#f12711:#f5af19>[Phoenix]</gradient> ",   material: FIRE_CHARGE,    rank: ultra}
  storm:     {name: "Storm",     format: "<gradient:#4568dc:#b06ab3>[⚡ Storm]</gradient> ",   material: LIGHTNING_ROD,  rank: ultra}
  legend:    {name: "Legend",    format: "<rainbow>[Legend]</rainbow> ",                       material: NETHER_STAR,    rank: ultra}

# ------------------------------------------------------------------------------
#  MONTHLY CLAIM BLOCK BONUS  (amounts are per rank above)
# ------------------------------------------------------------------------------
# ------------------------------------------------------------------------------
#  PURCHASES. Your store (Tebex) runs this command from the console when someone pays:
#     style give {id} pro 30        gives the Pro rank for 30 days, adds to the time left on a renewal
#     style remove {id} pro         takes it away again (refund, chargeback)
#  Both change the LuckPerms group, announce it, and give the monthly claim block bonus straight away.
#  The player must have joined the server once. Details in the README.
# ------------------------------------------------------------------------------
purchase:
  default-days: 30                      # used when the command has no number of days
  broadcast: true                       # tell everyone online when a rank is given

bonus:
  enabled: true
  announce-delay-seconds: 5             # wait after joining before giving and announcing it

# ------------------------------------------------------------------------------
#  MENUS AND MESSAGES (MiniMessage)
# ------------------------------------------------------------------------------
menu:
  title: "<gradient:#ff8a00:#e52e71>Style</gradient>"
  free-icon: IRON_INGOT                 # rank item for players with no paid rank

messages:
  prefix: "<gradient:#ff8a00:#e52e71>Style</gradient> <dark_gray>»</dark_gray> "
  no-permission: "<red>You cannot do that."
  players-only: "<red>Only players can use this."
  needs-rank: "<red>/{command} needs the {rank}<red> rank. Type <yellow>/style</yellow> to see what each rank gives."
  in-combat: "<red>You cannot use /{command} while in combat."
  trash-title: "<dark_red>Trash <gray>(closing destroys items)"
  trash-done: "<gray>Destroyed <white>{count}</white> item(s)."
  tag-set: "<green>Tag set to</green> {tag}"
  tag-cleared: "<green>Tag removed."
  tag-locked: "<red>The {tag}<red> tag needs the {rank}<red> rank."
  color-set: "<green>Chat colour set."
  color-cleared: "<green>Chat colour reset."
  color-locked: "<red>That colour needs the {rank}<red> rank."
  unknown-choice: "<red>Unknown choice. Open <yellow>/style</yellow> to pick from the list."
  bonus-given: "<green>Your monthly <gold>{rank}</gold> <green>bonus: <gold>{blocks}</gold> claim blocks added!"
  bonus-already: "<gray>You already got this month's bonus."
  bonus-none: "<gray>Your rank has no monthly bonus. Pro and Ultra get one every month."
  expired-note: "<gray>Your rank ended. Tags and colours that need it are switched off until you renew."
  reloaded: "<green>ArkaSMPStyle reloaded: {ranks} ranks, {colors} colours, {tags} tags."
  info-free: "<gray>Rank: <white>Free</white>"
  info-rank: "<gray>Rank: </gray>{rank}"
  info-player: "<gray>{player} is rank:</gray> {rank}"
  give-usage: "<red>Usage: /style give [player or uuid] [rank] [days]"
  remove-usage: "<red>Usage: /style remove [player or uuid] [rank]"
  give-ok: "<green>Gave {player} the {rank}<green> rank until <white>{until}</white>."
  remove-ok: "<green>Took the {rank}<green> rank from {player}."
  rank-granted: "<green>Thank you for supporting the server! Your {rank}<green> rank is active until <white>{until}</white>."
  purchase-broadcast: "<gold>{player}</gold> <gray>just got the</gray> {rank}<gray> rank. Thank you for supporting the server!"
  unknown-rank: "<red>That rank does not exist. Ranks are listed under 'ranks' in the config."
  unknown-player: "<red>{player} has not joined this server yet."
  bad-days: "<red>Days must be a whole number from 1 to {max}."
  group-missing: "<red>The LuckPerms group '{group}' does not exist yet. Run <yellow>/style setup apply</yellow> once (from the console) to create the groups."
  setup-preview: "<yellow>Preview only, nothing was changed. {count} change(s) would be made:"
  setup-done: "<green>LuckPerms updated: {count} change(s) made:"
  setup-line: "<gray> - {line}"
  setup-file: "<gray>Every change is listed in <white>{file}"
  setup-backup: "<gray>The groups as they were before are saved in <white>{file}"
  setup-nothing: "<green>LuckPerms already matches the config. Nothing to do."
  setup-next: "<yellow>To do it, run <white>/style setup apply"
  setup-errors: "<red>/style setup stopped. Nothing was changed. Fix this first:"
  setup-usage: "<red>Usage: /style setup  (preview)  or  /style setup apply"
  no-luckperms: "<red>LuckPerms is not installed, so ranks cannot be given or taken."
  grant-failed: "<red>LuckPerms could not make that change. See the console."
